 if(p.st>=1&&fa>0){const k=clamp((p.t-p.ht)/.28,0,1),s=(.38+.47*(1-(1-k)*(1-k))),open=p.st===1?Math.min(1,k*1.6):clamp(1-(p.t-p.bt)/.05,0,1),sh=p.st===2&&dd<.42?p.dir*Math.sin(dd*42)*9*(1-dd/.42)+rand(-2,2):0;

 ctx.fillStyle='rgba(8,5,4,.35)';ctx.fillRect(-EX,0,VW+2*EX,VH);

 txt('雨夜江湖 · 一对一决斗',64,152,17,C.chalk,'left',BF,4);
 const e=LADDER[SAVE.stage],sc=SCHOOLS[SAVE.school];
 rr(M_BTNS.start[0],M_BTNS.start[1],M_BTNS.start[2],M_BTNS.start[3],10);ctx.fillStyle=sc.col;ctx.fill();
 txt('闯 江 湖',M_BTNS.start[0]+M_BTNS.start[2]/2,M_BTNS.start[1]+26,26,'#140c08');txt('第 '+(SAVE.stage+1)+' 战 · 对手 '+e.name+(SAVE.ng?' · '+(SAVE.ng+1)+' 周目':''),M_BTNS.start[0]+M_BTNS.start[2]/2,M_BTNS.start[1]+52,13,'#2a1408','center',BF);
 ghostBtn(M_BTNS.prac,'练习场 · 学连招');ghostBtn(M_BTNS.school,'门派：'+sc.name+' · '+sc.wname+' · '+ELS[sc.el].name);ghostBtn(M_BTNS.train,'练功房');ghostBtn(M_BTNS.ladder,'江湖榜');
 coinLine(600,416,'left');txt('原型 v0.9 · 存档只在本浏览器 · 广告位为演示',600,444,12,C.dim,'left',BF,3);
 rr(R_MUTE_M[0],R_MUTE_M[1],R_MUTE_M[2],R_MUTE_M[3],6);ctx.fillStyle='rgba(255,255,255,.08)';ctx.fill();txt(muted?'静':'声',R_MUTE_M[0]+18,R_MUTE_M[1]+13.5,14,C.dim,'center',BF);
 txt('你 · '+sc.name+sc.wname,130,500,15,MP.rim,'center',DF,4);txt('下一个对手 · '+e.name,440,500,15,ME.rim,'center',DF,4);}
function panelBG(){if(!BGL)buildBG();if(BGI.ready){const W1=Math.max(1200,VW+2*EX),H1=W1*.45;ctx.fillStyle='#120807';ctx.fillRect(-EX,0,VW+2*EX,VH);ctx.drawImage(BGI.sky,(VW-W1)/2,GSY-430*H1/540,W1,H1);ctx.drawImage(BGI.mid,(VW-1500)/2,GSY+6-280,1500,280);ctx.drawImage(BGI.ground,(VW-1800)/2,GSY-1,1800,180);}else ctx.drawImage(BGL.sky,0,0,VW,VH);ctx.fillStyle='rgba(8,5,4,.82)';ctx.fillRect(-EX,0,VW+2*EX,VH);}

 LADDER.forEach((e,i)=>{const col=i<5?0:1,row=i%5,x=24+col*462,y=84+row*76,done=i<SAVE.stage,cur=i===SAVE.stage,sc=SCHOOLS[e.sch];
  rr(x,y,450,66,10);ctx.fillStyle=cur?'#2c211c':C.card;ctx.fill();ctx.strokeStyle=cur?e.rim:C.line;ctx.lineWidth=cur?2.4:1.2;ctx.stroke();
  txt(String(i+1),x+30,y+33,28,done?C.dim:e.rim,'center',DF);ctx.globalAlpha=i>SAVE.stage?.5:1;txt(e.name,x+60,y+24,22,e.rim,'left',DF);txt(e.title+' · '+sc.wname+' · '+ELS[sc.el].name,x+60,y+48,12,C.dim,'left',BF);ctx.globalAlpha=1;
  txt(done?'已击败':cur?'当前':'未挑战',x+430,y+33,14,cur?C.gold:C.dim,'right',BF);});
 ghostBtn(R_BACK,'返回');button(R_CHALLENGE,'挑战 '+LADDER[SAVE.stage].name,SCHOOLS[SAVE.school].col,'#140c08',18);}
function wrapTxt(str,x,y,maxW,lh,size,col){ctx.font=size+'px '+BF;let line='',yy=y;for(const ch of str){if(ctx.measureText(line+ch).width>maxW){txt(line,x,yy,size,col,'left',BF);line=ch;yy+=lh;}else line+=ch;}if(line)txt(line,x,yy,size,col,'left',BF);}
function drawSchool(){panelBG();txt('门派',24,40,32,C.chalk,'left',DF);txt('越贵的门派越强，招式也越多；每派兵器、连招、属性、绝招都不同',96,44,13,C.dim,'left',BF);coinLine(VW-24,40,'right');
 SCH_ORDER.forEach((id,i)=>{const sc=SCHOOLS[id],e=ELS[sc.el],r=schoolR(i),own=!!SAVE.unlocked[id],cur=SAVE.school===id,view=G.view===id,x=r[0]+14;
  rr(r[0],r[1],r[2],r[3],12);ctx.fillStyle=cur?'#2c211c':C.card;ctx.fill();ctx.strokeStyle=cur?sc.col:view?C.dim:C.line;ctx.lineWidth=cur?2.6:1.2;ctx.stroke();
  ctx.globalCompositeOperation='lighter';glow(r[0]+r[2]-34,r[1]+32,26,e.b,cur?.55:.3);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  txt(sc.name,x,r[1]+32,30,sc.col,'left');txt(sc.wname,x,r[1]+62,15,sc.col,'left',BF);txt('★'.repeat(sc.tier)+'☆'.repeat(5-sc.tier),r[0]+r[2]-12,r[1]+62,12,C.gold,'right',BF);
  txt(e.name+' · '+e.eff,x,r[1]+88,13,e.b,'left',BF);
  txt('绝招',x,r[1]+116,11,C.dim,'left',BF);txt((sc.ult||e.sp).name,x,r[1]+138,18,C.gold,'left',DF);
  wrapTxt(sc.motto,x,r[1]+166,r[2]-26,17,12,C.chalk);
  wrapTxt(sc.passive+(sc.pow>1?'；伤害、血量 +'+Math.round((sc.pow-1)*100)+'%':''),x,r[1]+222,r[2]-26,16,11,C.dim);
  wrapTxt('招式：'+sc.combo,x,r[1]+276,r[2]-26,15,11,'#c9b48a');
  const by=r[1]+r[3]-46;
  if(cur)txt('使用中',x,by+17,15,sc.col,'left',BF);else if(own)txt('点击使用',x,by+17,14,C.dim,'left',BF);
  else{const ub=[x-2,by,r[2]-24,34];rr(ub[0],ub[1],ub[2],ub[3],8);ctx.fillStyle=SAVE.coins>=sc.cost?C.gold:'#3a2e28';ctx.fill();coin(ub[0]+20,ub[1]+17,6);txt(sc.cost+' 解锁',ub[0]+ub[2]/2+10,ub[1]+18,14,SAVE.coins>=sc.cost?'#140c08':C.dim,'center',BF);}});
 drawToast(466);ghostBtn(R_BACK,'返回');const vs=SCHOOLS[G.view]||SCHOOLS.shaolin;button(R_CHALLENGE,'试玩 '+vs.name+' · 去练习场',vs.col,'#140c08',16);}

 TRAIN.forEach((t,i)=>{const r=trainR(i),l=SAVE.lv[t.id],max=l>=TMAX,c=tcost(l),ok=!max&&SAVE.coins>=c;
  rr(r[0],r[1],r[2],r[3],12);ctx.fillStyle=C.card;ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1.2;ctx.stroke();
  txt(t.name,r[0]+20,r[1]+34,28,C.gold,'left');txt('Lv '+l+' / '+TMAX,r[0]+90,r[1]+36,14,C.dim,'left',BF);
  txt('当前：'+(l?t.fx(l):'未修炼')+(max?'':'　下一级：'+t.fx(l+1)),r[0]+20,r[1]+76,14,C.chalk,'left',BF);
  const b=[r[0]+r[2]-120,r[1]+22,104,44];rr(b[0],b[1],b[2],b[3],10);ctx.fillStyle=ok?'#ff8a3d':'#2e2420';ctx.fill();
  if(max)txt('满级',b[0]+b[2]/2,b[1]+23,16,C.dim,'center',BF);else{coin(b[0]+24,b[1]+22,7);txt(String(c),b[0]+38,b[1]+23,16,ok?'#140c08':C.dim,'left',BF);}});
 drawToast(400);ghostBtn(R_BACK,'返回');}

 if(R.win){txt(R.cleared?'天 下 第 一':'胜',VW/2,110,R.cleared?72:120,C.gold,'center',DF,8);txt('击败 '+R.name+(R.cleared?' · 通关！下一周目对手更强':''),VW/2,186,18,C.chalk,'center',BF,4);}
 else{txt('败',VW/2,110,120,'#b8b0a8','center',DF,8);txt('败给了 '+R.name+' · 去练功房提升一下再来',VW/2,186,18,C.chalk,'center',BF,4);}
 txt('最高连击 '+R.maxCombo+'　·　铜钱 +'+R.coins,VW/2,230,18,C.gold,'center',BF,4);coinLine(VW/2,270);
 if(R.win){button(RES_BTNS.a,'下一战 · '+LADDER[SAVE.stage].name,SCHOOLS[SAVE.school].col,'#140c08',20);ghostBtn(RES_BTNS.b,'回大厅 · 练功');}
 else{if(!G.contUsed)button(RES_BTNS.a,'看广告 · 原地复活再战（演示）',C.gold,'#140c08',18);ghostBtn(RES_BTNS.b,'重新挑战');ghostBtn(RES_BTNS.c,'回大厅 · 练功');}}

 txt('广告位（演示）',VW/2,212,28,C.gold);txt(Math.ceil(G.adT)+' 秒后返回',VW/2,262,18,C.chalk,'center',BF);txt('正式版这里接微信激励视频广告',VW/2,316,13,C.dim,'center',BF);}

function render(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
 (ROT?ctx.setTransform(0,dpr*scale,-dpr*scale,0,dpr*(ROTW-oy),dpr*ox):ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy));ctx.save();ctx.beginPath();ctx.rect(-EX,0,VW+2*EX,VH);ctx.clip();
 if(G.state==='menu')drawMenu();
 else if(G.state==='ladder')drawLadder();else if(G.state==='school')drawSchool();else if(G.state==='train')drawTrain();
 else{drawScene([PL,EN]);if(G.state==='fight'){drawCine();drawHUD();drawControls();if(G.paused){ctx.fillStyle='rgba(8,5,4,.78)';ctx.fillRect(-EX,0,VW+2*EX,VH);txt('暂 停',VW/2,150,56,C.chalk,'center',DF,6);button(R_PAUSE.go,'继续战斗',PL.rim,'#140c08',20);ghostBtn(R_PAUSE.home,'回大厅（本场不算）',16);ghostBtn(R_PAUSE.snd,muted?'声音：关':'声音：开',15);}}else if(G.state==='result')drawResult();else if(G.state==='ad')drawAd();}
 if(portrait&&!G.portraitOK)drawPortrait();
 ctx.restore();}

resize();
let last=performance.now();
function frame(now){if(Math.abs(cv.clientWidth-CWc)>1||Math.abs(cv.clientHeight-CHc)>1)resize();const rdt=Math.min(.033,Math.max(0,(now-last)/1000));{const raw=(now-last)/1000;if(raw>0&&raw<.25&&G.state==='fight'&&!G.paused){G.fpsE=(G.fpsE||.016)*.97+raw*.03;G.slowT=G.fpsE>.03?(G.slowT||0)+raw:0;if(G.slowT>3&&!G.lowFx){G.lowFx=true;}}}last=now;G.rt+=rdt;ambient(rdt);
 if(G.state==='fight'&&G.paused){}
 else if(G.state==='fight'){const ts=G.slow>0?.3:1;if(G.slow>0)G.slow=Math.max(0,G.slow-rdt);update(rdt*ts);}
 else if(G.state==='ad'){G.adT-=rdt;if(G.adT<=0)continueFight();}
 else if(G.state==='menu')updateMenu(rdt);else fx(rdt);
 render();requestAnimationFrame(frame);}
window.__trs=()=>TRS();window.__dbg={G,SAVE,log:[],startAct,get projs(){return projs;},get PL(){return PL;},get EN(){return EN;},get LADDER(){return LADDER;},get audio(){return AC?[AC.state,muted,MASTER.gain.value]:['none',muted];}};
if(AUTO){setTimeout(()=>startFight(),300);setInterval(()=>{if(G.state==='result'){window.__dbg.log.push({stage:G.result.stage,win:G.result.win,t:Math.round(G.t)});startFight();}},1200);}
requestAnimationFrame(frame);
})();
