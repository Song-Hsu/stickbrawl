<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const VW=420,VH=760,FT=262,FB=520,CTRL=542;
const C={bg:'#0e0b0a',ui:'#130f0d',card:'#211a17',line:'#3d312b',chalk:'#efe6d8',dim:'#8f8174',gold:'#ffcf5a',red:'#ff4a3d',sil:'#0a0706'};
const DF='"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
const BF='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rand=(a,b)=>a+Math.random()*(b-a), lerp=(a,b,k)=>a+(b-a)*k;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgba=(h,a)=>{const c=hex(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';};
function srand(seed){return()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};}

/* ---------- canvas sizing + cached background layers ---------- */
let scale=1,ox=0,oy=0,dpr=1,KQ=1,BGL=null;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);const w=cv.clientWidth||VW,h=cv.clientHeight||VH;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);scale=Math.min(w/VW,h/VH);ox=(w-VW*scale)/2;oy=(h-VH*scale)/2;KQ=Math.min(3,dpr*scale);buildBG();}
window.addEventListener('resize',resize);

const GS={};
function gsprite(col){if(GS[col])return GS[col];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,rgba(col,1));gr.addColorStop(.22,rgba(col,.6));gr.addColorStop(1,rgba(col,0));g.fillStyle=gr;g.fillRect(0,0,64,64);return GS[col]=c;}
function glow(x,y,r,col,a){if(a<=0.01||r<=0.5)return;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(gsprite(col),x-r,y-r,r*2,r*2);}

function mkLayer(w,h,draw){const c=document.createElement('canvas');c.width=Math.ceil(w*KQ);c.height=Math.ceil(h*KQ);const g=c.getContext('2d');g.scale(KQ,KQ);draw(g);return c;}
const PAD=50,LW=VW+PAD*2,FLAGS=[];
function buildBG(){
 const r=srand(7);
 const sky=mkLayer(VW,FT+12,g=>{
  const gr=g.createLinearGradient(0,0,0,FT);gr.addColorStop(0,'#171211');gr.addColorStop(.45,'#33221c');gr.addColorStop(.8,'#7a3a1e');gr.addColorStop(1,'#a8501f');g.fillStyle=gr;g.fillRect(0,0,VW,FT+12);
  const hg=g.createRadialGradient(VW*.66,FT-26,10,VW*.66,FT-26,280);hg.addColorStop(0,'rgba(255,150,70,.55)');hg.addColorStop(1,'rgba(255,120,50,0)');g.fillStyle=hg;g.fillRect(0,0,VW,FT+12);
  for(let i=0;i<46;i++){const x=r()*VW,y=r()*130-10,rx=40+r()*80,ry=10+r()*22;g.fillStyle='rgba(24,17,15,'+(.35+r()*.4)+')';g.beginPath();g.ellipse(x,y,rx,ry,0,0,6.283);g.fill();if(y>50){g.fillStyle='rgba(200,100,50,.07)';g.beginPath();g.ellipse(x,y+ry*.55,rx*.8,ry*.35,0,0,6.283);g.fill();}}
 });
 const far=mkLayer(LW,FT+12,g=>{
  const ridge=(base,amp,col,step)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,FT+12);let y=base;for(let x=0;x<=LW;x+=step){y=clamp(y+(r()-.5)*amp,base-amp*1.6,base+amp*.6);g.lineTo(x,y);}g.lineTo(LW,FT+12);g.closePath();g.fill();};
  ridge(FT-58,26,'#4a2a1d',18);ridge(FT-34,18,'#2c1912',14);
  const fg=g.createLinearGradient(0,FT-60,0,FT);fg.addColorStop(0,'rgba(255,140,70,0)');fg.addColorStop(1,'rgba(255,140,70,.22)');g.fillStyle=fg;g.fillRect(0,FT-60,LW,60);
 });
 FLAGS.length=0;
 const ruins=mkLayer(LW,FT+12,g=>{
  const S='#170e0b';g.fillStyle=S;g.strokeStyle=S;g.lineCap='round';
  const base=FT-8;
  // ground lip
  g.beginPath();g.moveTo(0,base+2);for(let x=0;x<=LW;x+=16)g.lineTo(x,base-r()*5);g.lineTo(LW,FT+12);g.lineTo(0,FT+12);g.closePath();g.fill();
  // broken pillars
  for(const px of [60+r()*40,LW-90-r()*40,LW*.55]){const w=13+r()*7,h=55+r()*70;g.beginPath();g.moveTo(px,base);g.lineTo(px,base-h);for(let i=1;i<=4;i++)g.lineTo(px+w*i/4,base-h+(r()-.3)*14);g.lineTo(px+w,base);g.fill();g.fillRect(px-3,base-h+18,w+6,4);}
  // curved pipes / arches
  g.lineWidth=7;for(const ax of [LW*.3,LW*.78]){g.beginPath();g.moveTo(ax,base);g.lineTo(ax,base-60);g.quadraticCurveTo(ax,base-82,ax+22,base-80);g.lineTo(ax+30,base-78);g.stroke();}
  // dead trees
  const branch=(x,y,a,len,d)=>{const nx=x+Math.cos(a)*len,ny=y+Math.sin(a)*len;g.lineWidth=Math.max(1,d*1.3);g.beginPath();g.moveTo(x,y);g.lineTo(nx,ny);g.stroke();if(d>0){branch(nx,ny,a-.5-r()*.3,len*.68,d-1);branch(nx,ny,a+.4+r()*.3,len*.62,d-1);}};
  for(const tx of [LW*.15,LW*.68,LW*.92])branch(tx,base,-1.57+(r()-.5)*.3,22+r()*10,3);
  // swords stuck in the ground (sword graveyard)
  g.lineWidth=1.6;for(let i=0;i<11;i++){const sx=r()*LW,h=16+r()*20,tl=(r()-.5)*.5,by=base+r()*4;g.save();g.translate(sx,by);g.rotate(tl);g.beginPath();g.moveTo(0,0);g.lineTo(0,-h);g.stroke();g.beginPath();g.moveTo(-4,-h*.72);g.lineTo(4,-h*.72);g.stroke();g.restore();}
  // flag poles
  g.lineWidth=2;for(const fx of [LW*.22,LW*.47,LW*.86]){const h=58+r()*26;g.beginPath();g.moveTo(fx,base);g.lineTo(fx,base-h);g.stroke();FLAGS.push({x:fx,top:base-h});}
 });
 const floor=mkLayer(VW,CTRL-FT+14,g=>{
  const gr=g.createLinearGradient(0,0,0,CTRL-FT);gr.addColorStop(0,'#3d2318');gr.addColorStop(.18,'#24150f');gr.addColorStop(1,'#110b09');g.fillStyle=gr;g.fillRect(0,0,VW,CTRL-FT+14);
  const sh=g.createLinearGradient(0,0,0,40);sh.addColorStop(0,'rgba(255,140,70,.18)');sh.addColorStop(1,'rgba(255,140,70,0)');g.fillStyle=sh;g.fillRect(0,0,VW,40);
  for(let i=0;i<14;i++){const x=r()*VW,y=20+r()*(CTRL-FT-30),w=20+r()*50;g.fillStyle='rgba(255,150,90,'+(.04+r()*.05)+')';g.beginPath();g.ellipse(x,y,w,w*.12,0,0,6.283);g.fill();}
  for(let i=0;i<40;i++){const x=r()*VW,y=10+r()*(CTRL-FT-10),s=1+r()*3*(y/(CTRL-FT));g.fillStyle='#0c0807';g.beginPath();g.ellipse(x,y,s*1.6,s*.7,0,0,6.283);g.fill();}
  g.strokeStyle='#0c0807';g.lineWidth=1;for(let i=0;i<26;i++){const x=r()*VW,y=14+r()*(CTRL-FT-14),h=3+r()*6*(y/(CTRL-FT)+.4);for(let k=-2;k<=2;k++){g.beginPath();g.moveTo(x+k*1.2,y);g.lineTo(x+k*2.2,y-h);g.stroke();}}
 });
 const front=mkLayer(VW,44,g=>{
  g.fillStyle='#060403';g.beginPath();g.moveTo(0,44);let x=-10;while(x<VW+20){const w=50+r()*70,h=10+r()*16;g.quadraticCurveTo(x+w/2,44-h*2.2,x+w,44);x+=w*.8;}g.lineTo(VW,44);g.closePath();g.fill();
  g.strokeStyle='#060403';g.lineWidth=1.3;for(let i=0;i<40;i++){const x=r()*VW,h=6+r()*12;g.beginPath();g.moveTo(x,44);g.quadraticCurveTo(x+2,44-h*.6,x-2+r()*6,44-h-12);g.stroke();}
 });
 BGL={sky,far,ruins,floor,front};
}

/* ---------- audio: sfx + generated score ---------- */
let AC=null,MASTER=null,noiseBuf=null,muted=false;
try{muted=localStorage.getItem('stickbrawl-mute')==='1';}catch(e){}
function ensureAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=muted?0:.85;MASTER.connect(AC.destination);
  const n=AC.sampleRate|0;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const rain=AC.createBufferSource();rain.buffer=noiseBuf;rain.loop=true;const rf=AC.createBiquadFilter();rf.type='bandpass';rf.frequency.value=1400;rf.Q.value=.6;const rg=AC.createGain();rg.gain.value=.035;rain.connect(rf);rf.connect(rg);rg.connect(MASTER);rain.start();
  startMusic();}catch(e){AC=null;}}
function setMuted(m){muted=m;try{localStorage.setItem('stickbrawl-mute',m?'1':'0');}catch(e){}if(MASTER)MASTER.gain.value=m?0:.85;}
function voice(t,o){if(!AC)return;try{const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,o.v),t+(o.atk||.004));g.gain.exponentialRampToValueAtTime(.0001,t+o.dur);g.connect(MASTER);
 let src;if(o.noise){src=AC.createBufferSource();src.buffer=noiseBuf;}else{src=AC.createOscillator();src.type=o.type||'sine';src.frequency.setValueAtTime(o.f0,t);if(o.f1)src.frequency.exponentialRampToValueAtTime(o.f1,t+o.dur*.7);}
 let node=src;if(o.filt){const f=AC.createBiquadFilter();f.type=o.filt;f.frequency.setValueAtTime(o.fq,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+o.dur);if(o.q)f.Q.value=o.q;node.connect(f);node=f;}
 node.connect(g);if(o.noise)src.start(t,Math.random()*.5);else src.start(t);src.stop(t+o.dur+.05);}catch(e){}}
function sfx(n){if(!AC)return;const t=AC.currentTime;switch(n){
 case'hit':voice(t,{noise:1,dur:.09,v:.5,filt:'lowpass',fq:3200,f2:600});voice(t,{type:'triangle',f0:190,f1:70,dur:.1,v:.35});break;
 case'big':voice(t,{noise:1,dur:.26,v:.75,filt:'lowpass',fq:2600,f2:250});voice(t,{type:'sine',f0:130,f1:36,dur:.36,v:.85});break;
 case'whiff':voice(t,{noise:1,dur:.08,v:.12,filt:'bandpass',fq:2600,f2:900,q:1.5});break;
 case'whoosh':voice(t,{noise:1,dur:.24,v:.22,filt:'bandpass',fq:500,f2:3200,q:2,atk:.06});break;
 case'fire':voice(t,{noise:1,dur:.35,v:.25,filt:'lowpass',fq:1800,f2:400,atk:.02});break;
 case'zap':voice(t,{type:'sawtooth',f0:1800,f1:300,dur:.14,v:.1,filt:'highpass',fq:800});voice(t,{noise:1,dur:.12,v:.2,filt:'highpass',fq:3000});break;
 case'hurt':voice(t,{type:'sawtooth',f0:260,f1:90,dur:.25,v:.25,filt:'lowpass',fq:1200});break;
 case'clank':voice(t,{type:'square',f0:1900,f1:1500,dur:.13,v:.12});voice(t,{noise:1,dur:.07,v:.2,filt:'highpass',fq:4000});break;
 case'coin':voice(t,{type:'triangle',f0:1320,dur:.08,v:.1});voice(t+.06,{type:'triangle',f0:1760,dur:.14,v:.1});break;
 case'up':[523,659,784].forEach((f,i)=>voice(t+i*.07,{type:'triangle',f0:f,dur:.22,v:.15}));break;
 case'crate':voice(t,{noise:1,dur:.2,v:.45,filt:'bandpass',fq:900,q:3});voice(t,{type:'square',f0:150,f1:60,dur:.1,v:.14});break;
 case'roar':voice(t,{type:'sawtooth',f0:230,f1:70,dur:.65,v:.3,filt:'lowpass',fq:900,f2:300});voice(t,{noise:1,dur:.5,v:.25,filt:'lowpass',fq:700});break;
 case'gong':[98,147,196,262].forEach((f,i)=>voice(t,{f0:f,f1:f*.985,dur:1.9-i*.3,v:.32/(i+1)}));voice(t,{noise:1,dur:.4,v:.15,filt:'lowpass',fq:500});break;
 case'thud':voice(t,{f0:95,f1:38,dur:.22,v:.45});voice(t,{noise:1,dur:.12,v:.15,filt:'lowpass',fq:400});break;
 case'knife':voice(t,{noise:1,dur:.1,v:.1,filt:'highpass',fq:3000});break;
 case'thunder':voice(t,{noise:1,dur:2.2,v:.35,filt:'lowpass',fq:260,f2:60,atk:.08});voice(t,{noise:1,dur:.25,v:.2,filt:'lowpass',fq:1200});break;
}}
const MUS={timer:null,next:0,step:0,phrase:null};
const SPB=60/126/4,ROOTS=[0,0,-4,-2],PENTA=[0,3,5,7,10];
function startMusic(){if(MUS.timer||!AC)return;MUS.next=AC.currentTime+.1;MUS.timer=setInterval(sched,25);}
function newPhrase(){const p=[];let idx=6;for(let i=0;i<64;i++){if(i%2===0&&Math.random()<.5){idx=clamp(idx+((Math.random()*5|0)-2),3,11);p.push(idx);}else p.push(-1);}return p;}
function sched(){if(!AC)return;if(AC.state!=='running'){MUS.next=AC.currentTime+.1;return;}if(MUS.next<AC.currentTime-.2)MUS.next=AC.currentTime+.05;while(MUS.next<AC.currentTime+.15){mstep(MUS.step,MUS.next);MUS.next+=SPB;MUS.step=(MUS.step+1)%64;}}
function mstep(s,t){const b=s%16,bar=s>>4,root=ROOTS[bar],play=G.state==='play',boss=play&&E.some(e=>e.boss&&!e.dead),lv=play?1:.45;
 if(s===0)MUS.phrase=newPhrase();
 if(b===0)[0,7].forEach(iv=>voice(t,{type:'sawtooth',f0:55*2**((root+iv)/12),dur:SPB*16,v:.045*lv,filt:'lowpass',fq:520,atk:.4}));
 if(play){const kp=boss?[0,3,6,8,10,13]:[0,6,8,11];if(kp.includes(b))voice(t,{f0:140,f1:42,dur:.24,v:.55});
  if(b===4||b===12)voice(t,{noise:1,dur:.15,v:.26,filt:'highpass',fq:1300});
  if(boss&&bar===3&&b>=12)voice(t,{f0:240-(b-12)*30,f1:90,dur:.2,v:.35});}
 if(b%2===0)voice(t,{noise:1,dur:.035,v:(b%4===2?.05:.03)*lv,filt:'highpass',fq:7500});
 if([0,3,6,8,11,14].includes(b))voice(t,{type:'sawtooth',f0:110*2**((root+(b===11?7:0)-12)/12),dur:.2,v:.14*lv,filt:'lowpass',fq:420});
 const n=MUS.phrase?MUS.phrase[s]:-1;if(n>=0){const f=220*2**((PENTA[n%5]+12*Math.floor(n/5))/12);voice(t,{type:'triangle',f0:f*1.015,f1:f,dur:.5,v:.1*lv,filt:'lowpass',fq:3200,f2:700});voice(t,{type:'sawtooth',f0:f,dur:.3,v:.025*lv,filt:'lowpass',fq:1800,f2:500});}}

 for(let i=1;i<p.length;i++){const q=p[i],vx=(q.x-q.px)*.9,vy=(q.y-q.py)*.9;q.px=q.x;q.py=q.y;q.x+=vx+wind*dt2;q.y+=vy+520*dt2;}
 for(let it=0;it<4;it++)for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,df=(d-rb.seg)/d;if(i===1){b.x-=dx*df;b.y-=dy*df;}else{a.x+=dx*df*.5;a.y+=dy*df*.5;b.x-=dx*df*.5;b.y-=dy*df*.5;}}}

 const[mx]=moveVec();if(mx>.2)P.face=1;else if(mx<-.2)P.face=-1;

 const m=SC.moves[key];P.seq=key;P.mv=m;P.state='act';P.t=0;P.hitIdx=0;P.chainT=0;P.trail=[];
 if(m.name){G.mv={txt:m.name,t:1};sfx('whoosh');}

 return true;}

 case'burst':shock(P.x+f*24,P.y-30*VS,95,'#ffffff',.36,4);shock(P.x+f*24,P.y-30*VS,70,EL.b,.4,6);elBurst(P.x+f*24,P.y-30*VS,26,true);break;
 case'taiji':fxs.push({type:'taiji',x:P.x+f*30,y:hy,t:0,life:.5,f});fxs.push({type:'wave',x:P.x+f*14,y:hy,f,t:0,life:.32,r:R});for(let i=0;i<3;i++)zbolt(P.x+f*20,hy,P.x+f*rand(70,R),hy+rand(-24,24),.16,1.2);break;
 case'spin':fxs.push({type:'boltring',x:P.x,y:P.y-24*VS,t:0,life:.18,r:R*.85});shock(P.x,P.y,R,EL.b,.25,3,1);break;}

 if(hit){G.freeze=Math.max(G.freeze,m.stop||.045);G.shake=Math.max(G.shake,m.big?7:3);if(m.big){sfx('big');if(m.name)impact(first.x,first.y-first.z-28*first.s*VS,false);}else sfx('hit');}else if(!m.fx)sfx('whiff');}

function hitEnemy(e,dmg,kx,vz,o){o=o||{};const fromX=o.from==null?P.x:o.from;
 const blocked=e.shield&&!e.dead&&!o.guard&&!S.pierce&&(e.state==='walk'||e.state==='wind'||e.state==='attack')&&e.face===(Math.sign(fromX-e.x)||1);
 if(blocked){dmg*=.2;kx=0;vz=0;}
 const crit=!blocked&&Math.random()<S.crit;if(crit)dmg*=2;dmg=Math.max(1,Math.round(dmg));
 e.hp-=dmg;e.flash=.12;const dir=Math.sign(kx)||(e.x>fromX?1:-1);const hx=e.x-dir*6,hy=e.y-e.z-30*e.s*VS;
 if(blocked){nums.push({x:e.x,y:e.y-e.z-54*e.s*VS,txt:'挡',t:0,col:'#a8aec0'});hitSpark(hx-dir*6,hy,false,'#cfd6ea');sfx('clank');}
 else{nums.push({x:e.x+rand(-6,6),y:e.y-e.z-54*e.s*VS,txt:crit?dmg+'!':String(dmg),t:0,col:crit?C.gold:'#ffffff',big:crit});
  hitSpark(hx,hy,o.big||crit);elBurst(hx,hy,o.big?10:4,o.big);

  if(S.lifesteal&&P.hp>0)P.hp=Math.min(P.maxHp,P.hp+S.lifesteal);}
 if(e.hp<=0){e.dead=true;e.state='fly';e.vx=dir*Math.max(Math.abs(kx),340)*(e.boss?1.3:1);e.vz=Math.max(vz,e.boss?320:250);e.flyHits=new Set();e.bounce=0;
  G.kills++;G.score+=Math.round(15*e.s*e.s*(1+G.combo*.05));G.runCoins+=e.coin;nums.push({x:e.x,y:e.y-e.z-76*e.s*VS,txt:'+'+e.coin+' 铜',t:0,col:C.gold,coin:1});flyCoins(e.x,e.y-e.z-30,e.coin);sfx('coin');
  const last=spawn.left===0&&E.every(q=>q.dead);
  if(e.boss||last){G.slow=last?.9:.6;impact(e.x,e.y-e.z-30*e.s*VS,true);G.zoom=last?1.16:1.12;G.freeze=Math.max(G.freeze,.12);G.shake=16;sfx('big');shock(hx,hy,120,'#ffffff',.4,4);elBurst(hx,hy,24,true);if(last)G.finish=1.4;}
  return;}
 if(blocked)return;
 if(e.boss){if(Math.abs(kx)>300&&e.state!=='wind'){e.state='hurt';e.t=0;e.vx=kx*.3;}return;}
 if(vz>0||Math.abs(kx)>300){e.state='fly';e.vx=kx;e.vz=vz||130;e.flyHits=new Set();e.bounce=0;}else{e.state='hurt';e.t=0;e.vx=kx;}}

/* ---------- update ---------- */
function playerTarget(){const st=P.state;
 if(st==='idle')return[P.moving?'walk':'idle',24];
 if(st==='act'){const m=P.mv;if(m.dash)return['dash',40];let ps=m.pose==='spin'?'kick':m.pose;const h=m.hits[0];
  if(P.t<h*.85)return[ps+'_w',m.pose==='spin'?40:26];if(P.t>m.dur*.8)return['idle',14];return[ps,75];}
 if(st==='hurt')return['hurt',40];if(st==='dying')return['hurt',30];return['idle',20];}
function enemyTarget(e){switch(e.state){case'walk':return[e.moving?'walk':'idle',22];case'wind':return['wind',13];case'attack':return[e.ranged?'throw':'attack',70];case'hurt':return['hurt',45];case'fly':return['fly',30];default:return['hurt',30];}}

function updatePlayer(dt){P.ph+=dt;P.inv=Math.max(0,P.inv-dt);P.dashT=Math.max(0,P.dashT-dt);
 if(P.bufT>0)P.bufT-=dt;else P.buf=null;
 P.x+=P.kx*dt;P.kx*=Math.pow(.002,dt);
 if(P.state==='dying'){P.x=clamp(P.x,14,VW-14);}
 else if(P.state==='idle'){const[mx,my]=moveVec();P.moving=Math.abs(mx)+Math.abs(my)>.05;P.x+=mx*S.speed*dt;P.y+=my*S.speed*.72*dt;
  if(mx>.1)P.face=1;else if(mx<-.1)P.face=-1;
  if(P.chainT>0){P.chainT-=dt;if(P.chainT<=0)P.seq='';}
  if(!P.buf){if(held.P!==undefined)P.buf='P';else if(held.K!==undefined)P.buf='K';}
  if(P.buf&&startAct(P.buf)){P.buf=null;P.bufT=0;}}
 else if(P.state==='act'){P.t+=dt;const m=P.mv;
  if(m.dash){P.x+=P.face*760*dt;ghosts.push({x:P.x,y:P.y,f:P.face,t:0,J:JSON.parse(JSON.stringify(P.J))});
   if(SC.el==='fire')flame(P.x-P.face*6,P.y-rand(4,30),-P.face*rand(20,80),rand(-60,-10),.9);else if(SC.el==='bolt'&&Math.random()<.5)spark(P.x,P.y-rand(5,35),rand(0,6.28),rand(60,160),EL.b);else elParticle(P.x,P.y-rand(5,35));
   for(const e of E){if(e.dead||P.dashHit.has(e))continue;if(Math.abs(e.x-P.x)<26&&Math.abs(e.y-P.y)<24&&e.z<40){P.dashHit.add(e);hitEnemy(e,m.dmg*S.dmg,P.face*m.kx,m.vz,{from:P.x-P.face*30});G.freeze=Math.max(G.freeze,.04);G.shake=Math.max(G.shake,4);sfx('hit');}}
   for(const pr of props)if(!pr.broken&&Math.abs(pr.x-P.x)<22&&Math.abs(pr.y-P.y)<20)breakProp(pr,P.face);
   if(S.thunder){P.boltT-=dt;if(P.boltT<=0){P.boltT=.06;fxs.push({type:'field',x:P.x,y:P.y,t:0,life:1.4,tick:.05});}}
   if(P.t>=m.dur)endAct();}
  else{if(m.lunge&&P.t<m.dur*.6)P.x+=P.face*m.lunge*dt;
   while(P.hitIdx<m.hits.length&&P.t>=m.hits[P.hitIdx]){P.hitIdx++;moveHit(m);}
   if(P.buf==='D'&&P.hitIdx>=m.hits.length&&P.dashT<=0){P.buf=null;P.state='idle';P.chainT=.45;if(m.end)P.seq='';startAct('D');}
   else if(P.t>=m.dur)endAct();}}
 else if(P.state==='hurt'){P.t+=dt;if(P.t>=.3)P.state='idle';}
 P.x=clamp(P.x,14,VW-14);P.y=clamp(P.y,FT,FB);
 const[tp,rate]=playerTarget();blendTo(P,pose(tp,P.ph),rate,dt);
 // strike trail + elemental emission
 let tk=null;if(P.state==='act'&&!P.mv.dash){const m=P.mv,h=m.hits[0];if(P.t>=h*.7&&P.t<=m.hits[m.hits.length-1]+.08)tk=/kick|sweep|spin/.test(m.pose)?'rf':m.pose==='headbutt'?'D':'rh';}
 if(tk){const pt=wj(P,tk);P.trail.push(pt);if(P.trail.length>7)P.trail.shift();P.trailGold=!!P.mv.name;
  if(SC.el==='fire'){flame(pt[0],pt[1],rand(-30,30),rand(-80,-20),P.mv.name?1.2:.8);}
  else if(SC.el==='bolt'&&P.trail.length>1&&Math.random()<.7){const a=P.trail[P.trail.length-2];zbolt(a[0],a[1],pt[0],pt[1],.08,.8);}
  else if(SC.el==='qi')elParticle(pt[0],pt[1]);}
 else if(P.trail.length)P.trail.shift();
 const w=windNow(G.time);const n=wj(P,'N'),d=wj(P,'D');ropeStep(P.cape,n[0]-2*P.face,n[1]+2,dt,w);ropeStep(P.scarf,d[0]-5*P.face,d[1]-2,dt,w*1.2);
 if(Math.random()<dt*6){const hnd=wj(P,Math.random()<.5?'rh':'lh');if(SC.el==='fire')ember(hnd[0],hnd[1]);else if(SC.el==='bolt'&&Math.random()<.5)spark(hnd[0],hnd[1],rand(0,6.28),rand(30,90),EL.b,.15);}}

function updEnemy(e,dt){e.ph+=dt;e.flash=Math.max(0,e.flash-dt);e.cd-=dt;
 switch(e.state){
 case'fly':{e.x+=e.vx*dt;e.z+=e.vz*dt;e.vz-=1150*dt;e.rot-=dt*(e.dead?11:7);
  if(Math.abs(e.vx)>180){for(const o of E){if(o===e||o.dead||o.z>40||e.flyHits.has(o))continue;
    if(Math.abs(o.x-e.x)<22*o.s&&Math.abs(o.y-e.y)<20){e.flyHits.add(o);const d=(5+Math.abs(e.vx)/70)*S.projMult;hitEnemy(o,d,Math.sign(e.vx)*300,180,{guard:1,from:e.x});e.vx*=.7;G.shake=Math.max(G.shake,5);shock(o.x,o.y-20*VS,30,C.gold,.25,3);sfx('hit');}}
   for(const pr of props)if(!pr.broken&&e.z<40&&Math.abs(pr.x-e.x)<18&&Math.abs(pr.y-e.y)<16){breakProp(pr,Math.sign(e.vx));e.vx*=.8;}}
  if((e.x<8&&e.vx<0)||(e.x>VW-8&&e.vx>0)){e.vx*=-.45;G.shake=Math.max(G.shake,5);dust(e.x,e.y-e.z,6);shock(e.x,e.y-e.z-20,26,'#ffffff',.2,2);sfx('thud');}
  if(e.z<=0){e.z=0;if(e.bounce<1&&e.vz<-160){const heavy=e.vz<-420||e.s>1.2;e.vz=-e.vz*.35;e.bounce++;e.vx*=.6;dust(e.x,e.y,heavy?12:6);G.shake=Math.max(G.shake,heavy?6:3);if(heavy){addCrack(e.x,e.y,26*e.s);sfx('thud');}}
   else{e.vz=0;e.vx=0;dust(e.x,e.y,5);e.state=e.dead?'corpse':'down';e.t=0;}}
  break;}
 case'corpse':e.t+=dt;if(e.t>.6){e.fade-=dt*2;if(Math.random()<.4)addP({k:'smoke',x:e.x+rand(-14,14)*e.s,y:e.y-rand(0,8),vx:rand(-20,20),vy:rand(-50,-20),t:0,life:.6,sz:rand(3,6),col:'#24180f'});}break;
 case'down':e.t+=dt;if(e.t>.65){e.state='walk';e.rot=0;}break;

  rr(r[0],r[1],r[2],r[3],14);ctx.fillStyle=C.card;ctx.fill();ctx.strokeStyle=view?sc.col:C.line;ctx.lineWidth=view?2.5:1.2;ctx.stroke();
  ctx.globalAlpha=own?1:.55;txt(sc.name,r[0]+20,r[1]+30,30,sc.col,'left');txt(sc.elName,r[0]+86,r[1]+31,13,sc.col,'left',BF);txt(sc.motto,r[0]+128,r[1]+31,13,C.chalk,'left',BF);
  txt(sc.passive,r[0]+20,r[1]+70,13,C.dim,'left',BF);ctx.globalAlpha=1;
  if(cur)txt('使用中',r[0]+r[2]-18,r[1]+70,14,sc.col,'right',BF);
  else if(!own){coin(r[0]+r[2]-58,r[1]+70,6);txt(String(sc.cost),r[0]+r[2]-18,r[1]+70,15,C.gold,'right',BF);}});
 const sc=SCHOOLS[G.view];txt('招式表 · '+sc.name,24,460,18,sc.col,'left');
 Object.entries(sc.moves).filter(([k,m])=>m.name).forEach(([k,m],i)=>{const y=492+i*30;txt(seqText(k,sc),24,y,15,C.chalk,'left',BF);txt(m.name,VW-24,y,18,C.gold,'right');});
 drawToast(656);ghostBtn(R_BACK,'返回');}

function drawTrain(){ctx.fillStyle=C.bg;ctx.fillRect(0,0,VW,VH);
 txt('练功房',24,60,32,C.chalk,'left');coinLine(VW-22,62,'right');txt('永久提升，每局都生效',24,96,13,C.dim,'left',BF);
 TRAIN.forEach((t,i)=>{const r=trainR(i),l=SAVE.lv[t.id],max=l>=TMAX,c=tcost(l),ok=!max&&SAVE.coins>=c;
  rr(r[0],r[1],r[2],r[3],14);ctx.fillStyle=C.card;ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1.2;ctx.stroke();
  txt(t.name,r[0]+20,r[1]+30,26,C.gold,'left');txt('Lv '+l+' / '+TMAX,r[0]+86,r[1]+31,13,C.dim,'left',BF);
  txt('当前：'+(l?t.fx(l):'未修炼')+(max?'':'　下一级：'+t.fx(l+1)),r[0]+20,r[1]+64,13,C.chalk,'left',BF);
  const b=[r[0]+r[2]-106,r[1]+20,92,40];rr(b[0],b[1],b[2],b[3],10);ctx.fillStyle=ok?'#ff8a3d':'#2e2420';ctx.fill();
  if(max)txt('满级',b[0]+b[2]/2,b[1]+21,15,C.dim,'center',BF);else{coin(b[0]+20,b[1]+20,6);txt(String(c),b[0]+32,b[1]+21,15,ok?'#140c08':C.dim,'left',BF);}});
 drawToast(656);ghostBtn(R_BACK,'返回');}

function drawUpgrade(){dim(.72);txt('第 '+G.wave+' 波 · 打完了',VW/2,150,30,C.gold,'center',DF,4);txt('选一个强化（键盘 1/2/3）',VW/2,190,14,C.chalk,'center',BF);
 G.choices.forEach((u,i)=>{const r=cardR(i);rr(r[0],r[1],r[2],r[3],14);ctx.fillStyle=C.card;ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle=EL.b;ctx.fillRect(r[0],r[1]+18,3,r[3]-36);
  txt(u.name,r[0]+22,r[1]+36,28,C.gold,'left');const lv=G.taken[u.id];if(lv)txt('已有 '+lv+' 层',r[0]+r[2]-20,r[1]+36,12,C.dim,'right',BF);
  txt(u.desc,r[0]+22,r[1]+74,15,C.chalk,'left',BF);});
 if(!G.refreshUsed){rr(R_REFRESH[0],R_REFRESH[1],R_REFRESH[2],R_REFRESH[3],12);ctx.strokeStyle=C.dim;ctx.lineWidth=1.5;ctx.stroke();txt('看广告换一批（演示）',VW/2,R_REFRESH[1]+25,15,C.chalk,'center',BF);}}

function drawDead(){dim(.8);txt('倒  下  了',VW/2,150,54,C.red,'center',DF,6);
 if(G.newBest)txt('新纪录！',VW/2,200,18,C.gold,'center',DF);
 const lines=[['坚持到','第 '+G.wave+' 波'],['击倒',G.kills+' 人'],['最高连击',G.maxCombo+''],['本局铜钱','+'+G.banked]];
 lines.forEach((l,i)=>{txt(l[0],110,248+i*42,16,C.dim,'left',BF);txt(l[1],VW-110,248+i*42,24,i===3?C.gold:C.chalk,'right');});
 txt('铜钱已存入，可去练功房升级或解锁门派',VW/2,428,13,C.dim,'center',BF);coinLine(VW/2,458);
 if(!G.revived)button(R_REVIVE,'看广告 · 原地复活（演示）',C.gold,'#140c08',20);
 button(R_AGAIN,'再来一把',SC.col);ghostBtn(R_HOME,'回大厅 · 练功');}

function drawAd(){dim(.88);rr(50,260,320,220,16);ctx.fillStyle=C.card;ctx.fill();
 txt('广告位（演示）',VW/2,312,26,C.gold);txt(Math.ceil(G.adT)+' 秒后返回',VW/2,360,18,C.chalk,'center',BF);
 txt('正式版这里接微信激励视频广告',VW/2,410,13,C.dim,'center',BF);txt('看完给奖励：复活 / 换强化',VW/2,434,13,C.dim,'center',BF);}

function render(){
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
 ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy);ctx.save();ctx.beginPath();ctx.rect(0,0,VW,VH);ctx.clip();
 if(G.state==='school'){drawSchool();ctx.restore();return;}
 if(G.state==='train'){drawTrain();ctx.restore();return;}
 const inGame=G.state!=='menu'&&P;
 const off=inGame?P.x-VW/2:Math.sin(G.rt*.3)*30;
 ctx.save();ctx.beginPath();ctx.rect(0,0,VW,CTRL);ctx.clip();
 ctx.save();const sh=G.shake;if(sh)ctx.translate(rand(-sh,sh),rand(-sh,sh)*.6);
 if(G.zoom>1.001){ctx.translate(G.zx,G.zy);ctx.scale(G.zoom,G.zoom);ctx.translate(-G.zx,-G.zy);}
 drawBG(off);
 if(inGame)drawWorld(off);else drawMenuScene();
 ctx.drawImage(BGL.front,0,CTRL-44,VW,44);
 drawRain();
 ctx.restore();
 drawLines();
 const vg=ctx.createRadialGradient(VW/2,380,140,VW/2,380,430);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,G.hurtFlash>0?'rgba(170,20,10,'+(.35+G.hurtFlash)+')':'rgba(0,0,0,.55)');ctx.fillStyle=vg;ctx.fillRect(0,0,VW,CTRL);
 if(G.slow>0){ctx.fillStyle='rgba(20,10,5,'+Math.min(.25,G.slow*.3)+')';ctx.fillRect(0,0,VW,CTRL);}
 if(G.impact>0){if(G.impact>=2){ctx.globalCompositeOperation='difference';ctx.fillStyle='#ffffff';ctx.fillRect(0,0,VW,CTRL);if(G.impact===2){ctx.globalCompositeOperation='multiply';ctx.fillStyle=EL.b;ctx.fillRect(0,0,VW,CTRL);}ctx.globalCompositeOperation='source-over';}else{ctx.fillStyle='rgba(255,250,240,.28)';ctx.fillRect(0,0,VW,CTRL);}G.impact--;}
 ctx.restore();
 if(G.state==='menu')drawMenuUI();
 else{drawHUD();drawControls();if(G.state==='upgrade')drawUpgrade();else if(G.state==='dead')drawDead();else if(G.state==='ad')drawAd();}
 ctx.restore();}

resize();
let last=performance.now();
function frame(now){const rdt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;G.rt+=rdt;
 ambient(rdt);
 if(G.state==='play'){const ts=G.slow>0?.3:1;if(G.slow>0)G.slow=Math.max(0,G.slow-rdt);update(rdt*ts);}
 else if(G.state==='ad'){G.adT-=rdt;fx(rdt);if(G.adT<=0){G.state=G.adBack;const cb=G.adCb;G.adCb=null;cb&&cb();}}
 else{fx(rdt);if(G.state==='menu')updateMenu(rdt);}
 render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
