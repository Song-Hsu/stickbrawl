<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const VW=960,VH=540,GSY=430,ARENA=700,VS=2.2;
const C={bg:'#0e0b0a',ui:'#130f0d',card:'#211a17',line:'#3d312b',chalk:'#efe6d8',dim:'#8f8174',gold:'#ffcf5a',red:'#ff4a3d',sil:'#0a0706'};
const DF='"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';
const BF='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rand=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,k)=>a+(b-a)*k,sgn=v=>v<0?-1:1;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgba=(h,a)=>{const c=hex(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';};
function srand(seed){return()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};}
let AUTO=false;try{AUTO=/auto/.test(location.hash);}catch(e){}

/* ---------- sizing + cached layers ---------- */
let scale=1,ox=0,oy=0,dpr=1,KQ=1,BGL=null,portrait=false;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);const w=cv.clientWidth||VW,h=cv.clientHeight||VH;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);scale=Math.min(w/VW,h/VH);ox=(w-VW*scale)/2;oy=(h-VH*scale)/2;KQ=Math.min(2.5,dpr*scale);portrait=h>w*1.05;buildBG();}
window.addEventListener('resize',resize);
const GS={};
function gsprite(col){if(GS[col])return GS[col];const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,rgba(col,1));gr.addColorStop(.22,rgba(col,.6));gr.addColorStop(1,rgba(col,0));g.fillStyle=gr;g.fillRect(0,0,64,64);return GS[col]=c;}
function glow(x,y,r,col,a){if(a<=.01||r<=.5)return;ctx.globalAlpha=Math.min(1,a);ctx.drawImage(gsprite(col),x-r,y-r,r*2,r*2);}
function mkLayer(w,h,draw,k){const q=KQ*(k||1),c=document.createElement('canvas');c.width=Math.ceil(w*q);c.height=Math.ceil(h*q);const g=c.getContext('2d');g.scale(q,q);draw(g);return c;}
const FLAGS=[];
function buildBG(){const r=srand(11);
 const sky=mkLayer(VW,VH,g=>{const gr=g.createLinearGradient(0,0,0,GSY+20);gr.addColorStop(0,'#141010');gr.addColorStop(.42,'#2e1f1a');gr.addColorStop(.78,'#6e351c');gr.addColorStop(1,'#b0561f');g.fillStyle=gr;g.fillRect(0,0,VW,VH);
  const hg=g.createRadialGradient(VW*.62,GSY-30,10,VW*.62,GSY-30,560);hg.addColorStop(0,'rgba(255,150,70,.5)');hg.addColorStop(1,'rgba(255,120,50,0)');g.fillStyle=hg;g.fillRect(0,0,VW,VH);
  for(let i=0;i<80;i++){const x=r()*VW,y=r()*210-20,rx=60+r()*140,ry=12+r()*26;g.fillStyle='rgba(24,17,15,'+(.3+r()*.45)+')';g.beginPath();g.ellipse(x,y,rx,ry,0,0,6.283);g.fill();if(y>80){g.fillStyle='rgba(210,105,50,.07)';g.beginPath();g.ellipse(x,y+ry*.55,rx*.8,ry*.35,0,0,6.283);g.fill();}}});
 const far=mkLayer(1200,240,g=>{const ridge=(base,amp,col,step)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,240);let y=base;for(let x=0;x<=1200;x+=step){y=clamp(y+(r()-.5)*amp,base-amp*1.7,base+amp*.6);g.lineTo(x,y);}g.lineTo(1200,240);g.closePath();g.fill();};
  ridge(170,34,'#4a2a1d',22);ridge(205,22,'#2c1912',16);const fg=g.createLinearGradient(0,150,0,240);fg.addColorStop(0,'rgba(255,140,70,0)');fg.addColorStop(1,'rgba(255,140,70,.22)');g.fillStyle=fg;g.fillRect(0,150,1200,90);});
 FLAGS.length=0;
 const ruins=mkLayer(1500,280,g=>{const S='#170e0b',base=274;g.fillStyle=S;g.strokeStyle=S;g.lineCap='round';
  g.beginPath();g.moveTo(0,base+2);for(let x=0;x<=1500;x+=18)g.lineTo(x,base-r()*6);g.lineTo(1500,280);g.lineTo(0,280);g.closePath();g.fill();
  for(const px of [140,520,880,1300]){const w=18+r()*10,h=80+r()*110;g.beginPath();g.moveTo(px,base);g.lineTo(px,base-h);for(let i=1;i<=4;i++)g.lineTo(px+w*i/4,base-h+(r()-.3)*18);g.lineTo(px+w,base);g.fill();g.fillRect(px-4,base-h+24,w+8,5);}
  g.lineWidth=9;for(const ax of [330,760,1150]){g.beginPath();g.moveTo(ax,base);g.lineTo(ax,base-90);g.quadraticCurveTo(ax,base-118,ax+30,base-116);g.lineTo(ax+42,base-113);g.stroke();}
  const branch=(x,y,a,len,d)=>{const nx=x+Math.cos(a)*len,ny=y+Math.sin(a)*len;g.lineWidth=Math.max(1,d*1.6);g.beginPath();g.moveTo(x,y);g.lineTo(nx,ny);g.stroke();if(d>0){branch(nx,ny,a-.5-r()*.3,len*.68,d-1);branch(nx,ny,a+.4+r()*.3,len*.62,d-1);}};
  for(const tx of [60,430,980,1420])branch(tx,base,-1.57+(r()-.5)*.3,30+r()*14,3);
  g.lineWidth=2;for(let i=0;i<22;i++){const sx=r()*1500,h=22+r()*26,tl=(r()-.5)*.5;g.save();g.translate(sx,base+r()*4);g.rotate(tl);g.beginPath();g.moveTo(0,0);g.lineTo(0,-h);g.stroke();g.beginPath();g.moveTo(-5,-h*.72);g.lineTo(5,-h*.72);g.stroke();g.restore();}
  g.lineWidth=2.6;for(const fx of [250,640,1010,1380]){const h=90+r()*40;g.beginPath();g.moveTo(fx,base);g.lineTo(fx,base-h);g.stroke();FLAGS.push({x:fx,top:base-h});}});
 const ground=mkLayer(1800,180,g=>{const gr=g.createLinearGradient(0,0,0,180);gr.addColorStop(0,'#3a2117');gr.addColorStop(.12,'#24150f');gr.addColorStop(1,'#0f0a08');g.fillStyle=gr;g.fillRect(0,0,1800,180);
  const sh=g.createLinearGradient(0,0,0,30);sh.addColorStop(0,'rgba(255,140,70,.22)');sh.addColorStop(1,'rgba(255,140,70,0)');g.fillStyle=sh;g.fillRect(0,0,1800,30);
  for(let i=0;i<22;i++){const x=r()*1800,y=14+r()*150,w=30+r()*70;g.fillStyle='rgba(255,150,90,'+(.04+r()*.05)+')';g.beginPath();g.ellipse(x,y,w,w*.1,0,0,6.283);g.fill();}
  for(let i=0;i<70;i++){const x=r()*1800,y=6+r()*170,s=1.5+r()*4*(y/180+.3);g.fillStyle='#0c0807';g.beginPath();g.ellipse(x,y,s*1.7,s*.7,0,0,6.283);g.fill();}
  g.strokeStyle='#0c0807';g.lineWidth=1.2;for(let i=0;i<60;i++){const x=r()*1800,y=8+r()*170,h=4+r()*9;for(let k=-2;k<=2;k++){g.beginPath();g.moveTo(x+k*1.4,y);g.lineTo(x+k*2.6,y-h);g.stroke();}}},1.4);
 const front=mkLayer(2600,110,g=>{g.fillStyle='#060403';g.beginPath();g.moveTo(0,110);let x=-10;while(x<2620){const w=90+r()*160,h=16+r()*30;g.quadraticCurveTo(x+w/2,110-h*2.4,x+w,110);x+=w*.75;}g.lineTo(2600,110);g.closePath();g.fill();
  g.strokeStyle='#060403';g.lineWidth=1.6;for(let i=0;i<120;i++){const x=r()*2600,h=8+r()*20;g.beginPath();g.moveTo(x,110);g.quadraticCurveTo(x+3,110-h*.6,x-3+r()*8,110-h-22);g.stroke();}});
 BGL={sky,far,ruins,ground,front};}

/* ---------- audio ---------- */
let AC=null,MASTER=null,noiseBuf=null,muted=false;
try{muted=localStorage.getItem('stickbrawl-mute')==='1';}catch(e){}
function ensureAudio(){if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=muted?0:.85;MASTER.connect(AC.destination);
  const n=AC.sampleRate|0;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const rain=AC.createBufferSource();rain.buffer=noiseBuf;rain.loop=true;const rf=AC.createBiquadFilter();rf.type='bandpass';rf.frequency.value=1400;rf.Q.value=.6;const rg=AC.createGain();rg.gain.value=.035;rain.connect(rf);rf.connect(rg);rg.connect(MASTER);rain.start();
  startMusic();}catch(e){AC=null;}}
function setMuted(m){muted=m;try{localStorage.setItem('stickbrawl-mute',m?'1':'0');}catch(e){}if(MASTER)MASTER.gain.value=m?0:.85;}
function voice(t,o){if(!AC)return;try{const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,o.v),t+(o.atk||.004));g.gain.exponentialRampToValueAtTime(.0001,t+o.dur);g.connect(MASTER);
 let src;if(o.noise){src=AC.createBufferSource();src.buffer=noiseBuf;}else{src=AC.createOscillator();src.type=o.type||'sine';src.frequency.setValueAtTime(o.f0,t);if(o.f1)src.frequency.exponentialRampToValueAtTime(o.f1,t+o.dur*.7);}
 let node=src;if(o.filt){const f=AC.createBiquadFilter();f.type=o.filt;f.frequency.setValueAtTime(o.fq,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+o.dur);if(o.q)f.Q.value=o.q;node.connect(f);node=f;}
 node.connect(g);if(o.noise)src.start(t,Math.random()*.5);else src.start(t);src.stop(t+o.dur+.05);}catch(e){}}
function sfx(n){if(!AC)return;const t=AC.currentTime;switch(n){
 case'hit':voice(t,{noise:1,dur:.1,v:.5,filt:'lowpass',fq:3400,f2:600});voice(t,{type:'triangle',f0:200,f1:70,dur:.1,v:.35});voice(t,{f0:110,f1:45,dur:.14,v:.45});break;
 case'big':voice(t,{noise:1,dur:.28,v:.75,filt:'lowpass',fq:2600,f2:250});voice(t,{f0:130,f1:34,dur:.38,v:.85});break;
 case'swing':voice(t,{noise:1,dur:.12,v:.16,filt:'bandpass',fq:900,f2:3200,q:1.4,atk:.03});break;
 case'whoosh':voice(t,{noise:1,dur:.28,v:.24,filt:'bandpass',fq:450,f2:3400,q:2,atk:.07});break;
 case'fire':voice(t,{noise:1,dur:.45,v:.3,filt:'lowpass',fq:1800,f2:300,atk:.03});break;
 case'zap':voice(t,{type:'sawtooth',f0:1900,f1:240,dur:.18,v:.12,filt:'highpass',fq:700});voice(t,{noise:1,dur:.14,v:.22,filt:'highpass',fq:3000});break;
 case'roar':voice(t,{type:'sawtooth',f0:230,f1:65,dur:.7,v:.32,filt:'lowpass',fq:900,f2:300});voice(t,{noise:1,dur:.55,v:.25,filt:'lowpass',fq:700});break;
 case'clang':[2100,2870,3720].forEach((f,i)=>voice(t,{type:i?'sine':'triangle',f0:f,f1:f*.995,dur:.9-i*.2,v:.16/(i+1)}));voice(t,{noise:1,dur:.12,v:.4,filt:'highpass',fq:2500});voice(t,{f0:160,f1:60,dur:.2,v:.4});break;
 case'parry':[1568,2350,3136].forEach((f,i)=>voice(t+i*.03,{type:'triangle',f0:f,dur:.8,v:.14}));voice(t,{noise:1,dur:.1,v:.35,filt:'highpass',fq:3000});break;
 case'poison':voice(t,{noise:1,dur:.35,v:.25,filt:'bandpass',fq:700,f2:300,q:3});voice(t,{type:'sine',f0:300,f1:140,dur:.3,v:.15});break;
 case'tigr':voice(t,{type:'sawtooth',f0:180,f1:60,dur:.8,v:.35,filt:'lowpass',fq:1200,f2:300});voice(t,{noise:1,dur:.6,v:.3,filt:'bandpass',fq:900,q:1});break;
 case'cry':voice(t,{type:'triangle',f0:1600,f1:2600,dur:.5,v:.14});voice(t+.15,{type:'triangle',f0:2200,f1:1400,dur:.5,v:.1});break;
 case'perfect':voice(t,{type:'triangle',f0:1318,dur:.12,v:.14});voice(t+.05,{type:'triangle',f0:1976,dur:.22,v:.14});break;
 case'good':voice(t,{type:'triangle',f0:988,dur:.16,v:.12});break;
 case'miss':voice(t,{type:'sawtooth',f0:170,f1:95,dur:.22,v:.12,filt:'lowpass',fq:900});break;
 case'ice':voice(t,{type:'triangle',f0:3200,f1:2800,dur:.3,v:.12});voice(t+.04,{type:'triangle',f0:4600,dur:.25,v:.08});voice(t,{noise:1,dur:.12,v:.25,filt:'highpass',fq:5000});break;
 case'clank':voice(t,{type:'triangle',f0:2650,f1:2600,dur:.55,v:.22});voice(t,{f0:3960,f1:3900,dur:.35,v:.1});voice(t,{f0:1320,f1:1300,dur:.25,v:.08});voice(t,{noise:1,dur:.05,v:.35,filt:'highpass',fq:3500});voice(t,{f0:180,f1:90,dur:.08,v:.25});break;
 case'block':voice(t,{type:'square',f0:900,f1:600,dur:.08,v:.08});voice(t,{noise:1,dur:.07,v:.25,filt:'bandpass',fq:1800,q:2});break;
 case'break':voice(t,{noise:1,dur:.35,v:.55,filt:'lowpass',fq:1500,f2:200});voice(t,{type:'square',f0:300,f1:80,dur:.25,v:.15});break;
 case'hurt':voice(t,{type:'sawtooth',f0:260,f1:90,dur:.25,v:.22,filt:'lowpass',fq:1200});break;
 case'coin':voice(t,{type:'triangle',f0:1320,dur:.08,v:.1});voice(t+.06,{type:'triangle',f0:1760,dur:.14,v:.1});break;
 case'up':[523,659,784].forEach((f,i)=>voice(t+i*.07,{type:'triangle',f0:f,dur:.22,v:.15}));break;
 case'gong':[98,147,196,262].forEach((f,i)=>voice(t,{f0:f,f1:f*.985,dur:1.9-i*.3,v:.32/(i+1)}));voice(t,{noise:1,dur:.4,v:.15,filt:'lowpass',fq:500});break;
 case'thud':voice(t,{f0:95,f1:38,dur:.22,v:.45});voice(t,{noise:1,dur:.12,v:.15,filt:'lowpass',fq:400});break;
 case'rock':voice(t,{noise:1,dur:.6,v:.5,filt:'lowpass',fq:900,f2:120});voice(t,{f0:70,f1:30,dur:.5,v:.5});break;
 case'thunder':voice(t,{noise:1,dur:2.2,v:.35,filt:'lowpass',fq:260,f2:60,atk:.08});voice(t,{noise:1,dur:.25,v:.2,filt:'lowpass',fq:1200});break;
 case'strike':voice(t,{noise:1,dur:.6,v:.6,filt:'lowpass',fq:4000,f2:200});voice(t,{type:'sawtooth',f0:900,f1:60,dur:.3,v:.2});break;
}}
const MUS={timer:null,next:0,step:0,phrase:null};
const SPB=60/126/4,ROOTS=[0,0,-4,-2],PENTA=[0,3,5,7,10];
function startMusic(){if(MUS.timer||!AC)return;MUS.next=AC.currentTime+.1;MUS.timer=setInterval(sched,25);}
function newPhrase(){const p=[];let idx=6;for(let i=0;i<64;i++){if(i%2===0&&Math.random()<.5){idx=clamp(idx+((Math.random()*5|0)-2),3,11);p.push(idx);}else p.push(-1);}return p;}
function sched(){if(!AC)return;if(AC.state!=='running'){MUS.next=AC.currentTime+.1;return;}if(MUS.next<AC.currentTime-.2)MUS.next=AC.currentTime+.05;while(MUS.next<AC.currentTime+.15){mstep(MUS.step,MUS.next);MUS.next+=SPB;MUS.step=(MUS.step+1)%64;}}
function mstep(s,t){const b=s%16,bar=s>>4,root=ROOTS[bar],play=G.state==='fight'&&G.intro<=0&&!G.ko,boss=play&&EN&&EN.boss,lv=play?1:.45;
 if(s===0)MUS.phrase=newPhrase();
 if(b===0)[0,7].forEach(iv=>voice(t,{type:'sawtooth',f0:55*2**((root+iv)/12),dur:SPB*16,v:.045*lv,filt:'lowpass',fq:520,atk:.4}));
 if(play){const kp=boss?[0,3,6,8,10,13]:[0,6,8,11];if(kp.includes(b))voice(t,{f0:140,f1:42,dur:.24,v:.55});
  if(b===4||b===12)voice(t,{noise:1,dur:.15,v:.26,filt:'highpass',fq:1300});if(bar===3&&b>=12)voice(t,{f0:240-(b-12)*30,f1:90,dur:.2,v:.3});}
 if(b%2===0)voice(t,{noise:1,dur:.035,v:(b%4===2?.05:.03)*lv,filt:'highpass',fq:7500});
 if([0,3,6,8,11,14].includes(b))voice(t,{type:'sawtooth',f0:110*2**((root+(b===11?7:0)-12)/12),dur:.2,v:.14*lv,filt:'lowpass',fq:420});
 const n=MUS.phrase?MUS.phrase[s]:-1;if(n>=0){const f=220*2**((PENTA[n%5]+12*Math.floor(n/5))/12);voice(t,{type:'triangle',f0:f*1.015,f1:f,dur:.5,v:.1*lv,filt:'lowpass',fq:3200,f2:700});voice(t,{type:'sawtooth',f0:f,dur:.3,v:.025*lv,filt:'lowpass',fq:1800,f2:500});}}

/* ---------- save ---------- */

SAVE.stage=SAVE.stage|0;SAVE.ng=SAVE.ng|0;SAVE.trials=SAVE.trials||{};

const TPL={

 {const up=projs.find(p=>p.owner===T&&p.fx&&!p.hit);if(up&&ai.ultSeen!==up){ai.ultSeen=up;if(Math.random()<.15+.6*ai.d)ai.block=2.2;}else if(!up&&T.state==='act'&&T.mv&&T.mv.sp&&!ai.ultCast){ai.ultCast=true;}if(!up&&!(T.state==='act'&&T.mv&&T.mv.sp))ai.ultCast=false;}

function bFlame(x0,y0,x1,y1,w,bend,col,a){const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;ctx.fillStyle=rgba(col,a);ctx.beginPath();ctx.moveTo(x0+nx*w,y0+ny*w);ctx.quadraticCurveTo(x0+dx*.5+nx*(w+bend),y0+dy*.5+ny*(w+bend),x1,y1);ctx.quadraticCurveTo(x0+dx*.5+nx*bend*.6,y0+dy*.5+ny*bend*.6,x0-nx*w,y0-ny*w);ctx.closePath();ctx.fill();}

function fxPhoenixD(p,el){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
 if(p.spk){const d=p.t-p.spk;if(d<1){for(let i=0;i<5;i++){const g=clamp((d-Math.abs(i-2)*.04)/.1,0,1),f=clamp(1-(d-.5)/.5,0,1);if(g<=0||f<=0)continue;const hx=p.sx+(i-2)*28,H=(50+(2-Math.abs(i-2))*26)*g,w=8+(2-Math.abs(i-2))*3,lean=(i-2)*.14;
   ctx.globalCompositeOperation='source-over';ctx.globalAlpha=f*.85;ctx.fillStyle='#2a63d6';ctx.beginPath();ctx.moveTo(hx-w,0);ctx.lineTo(hx+Math.sin(lean)*H,-H);ctx.lineTo(hx+w,0);ctx.closePath();ctx.fill();ctx.fillStyle='#8fd8ff';ctx.beginPath();ctx.moveTo(hx-w*.2,0);ctx.lineTo(hx+Math.sin(lean)*H,-H);ctx.lineTo(hx+w,0);ctx.closePath();ctx.fill();ctx.globalCompositeOperation='lighter';ctx.strokeStyle='#e8faff';ctx.lineWidth=1.2;ctx.stroke();}}}
 if(p.st===0){ctx.globalCompositeOperation='lighter';glow(p.x,p.cy,70,el.b,.35);glow(p.x,p.cy,30,'#ffffff',.35);ctx.strokeStyle='#eefaff';ctx.lineWidth=1.6;
  for(const f of p.flakes){const x=p.x-p.dir*f[0],y=p.cy+f[1]+Math.sin(p.t*6+f[3])*6,r=f[2];glow(x,y,r*2.2,el.b,.35);fxSnowflake(x,y,r,p.t*f[4]+f[3],.95);}}
 else{const P=p.pts,n=P.length,d=p.t-p.bt,fa=d<1.25?1:clamp(1-(d-1.25)/.4,0,1);
  if(n>2&&fa>0){ctx.globalCompositeOperation='lighter';fxRibbon(P,i=>1+7*Math.pow(i/(n-1),.8),el.b,.35,fa);fxRibbon(P,i=>.6+2.4*(i/(n-1)),'#eafaff',.8,fa);
   const H=P[n-1],Q=P[Math.max(0,n-3)],vx=H[0]-Q[0],vy=H[1]-Q[1],up=d>.9,fl=up?p.dir:(vx>=0?1:-1),dep=H[2]||0,sc=(.78+.22*dep),W=165*sc,Hh=W*2/3;
   ctx.save();ctx.translate(H[0],H[1]);ctx.scale(fl,1);ctx.rotate(up?-.75:-.12+Math.max(-.3,Math.min(.3,vy/(Math.abs(vx)+1)*.3)));ctx.scale(1,1+.06*Math.sin(p.t*16));

 if(p.t>.3&&p.t<.55&&Math.random()<.5)addP({k:'bubble',x:p.x+rand(-10,10),y:fxSerpY(p.t)+rand(0,10),vx:rand(-20,20),vy:rand(40,120),t:0,life:rand(.4,.7),sz:rand(2,5)});

function fxTurtleD(p,el){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
 // vortex in the sky
 const vf=p.t<1.1?clamp(p.t/.2,0,1):clamp(1-(p.t-1.1)/.4,0,1);if(vf>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.translate(p.x,-296);ctx.scale(1,.28);for(let r=0;r<3;r++){ctx.rotate(p.t*(2+r));ctx.strokeStyle=r%2?'#9a4cff':el.b;ctx.globalAlpha=vf*(.5-r*.1);ctx.lineWidth=6-r;ctx.beginPath();ctx.arc(0,0,70+r*26,0,4.2);ctx.stroke();}glow(0,0,120,el.b,.3*vf);glow(0,0,60,'#9a4cff',.35*vf);
  ctx.strokeStyle='#b8ff7a';ctx.lineWidth=2;ctx.globalAlpha=vf*.7;ctx.beginPath();for(let k=0;k<=6;k++){const b=k*Math.PI/3+p.t;ctx.lineTo(Math.cos(b)*34,Math.sin(b)*34);}ctx.stroke();ctx.restore();}
 if(p.ptT){const d=p.t-p.ptT,fade=clamp(1-(d-2)/.6,0,1);ctx.save();ctx.globalCompositeOperation='lighter';for(let i=0;i<6;i++){const cx=p.px+Math.sin(p.t*1.3+i*1.7)*80,cy=-18-Math.abs(Math.cos(p.t+i))*30;glow(cx,cy,56,i%2?el.b:'#9a4cff',.16*fade);}ctx.restore();}
 const sa=p.t<1.0?1:clamp(1-(p.t-1.0)/.15,0,1);
 if(sa>0&&!xwOK()){const hy=fxSerpY(p.t),hx=p.x,P=[],Lb=Math.max(40,hy+318);for(let i=26;i>=0;i--){const s=i/26;P.push([hx+Math.sin(s*7+p.t*6)*28*s+Math.sin(p.t*3)*5*s,hy-s*Lb,Math.cos(s*7+p.t*6)]);}
  const n=P.length,W=i=>(5+7*Math.pow(i/(n-1),.5))*(.85+.2*P[i][2]);
  ctx.globalCompositeOperation='lighter';fxRibbon(P,i=>W(i)*2.6,'#9a4cff',.22,sa);ctx.globalCompositeOperation='source-over';
  fxSolid(P,i=>W(i)+3,'#0c240a',sa);const S=fxSolid(P,W,'#2f8f22',sa);fxSolid(P.map((q,i)=>{const[nx,ny]=fxNorm(P,i),o=W(i)*.25;return[q[0]-ny*o,q[1]+nx*o,1];}),i=>W(i)*.3,'#cfff8a',sa*.85);
  ctx.strokeStyle='#103a0c';ctx.lineWidth=1;for(let i=2;i<n-1;i++){const q=S.R[i];ctx.globalAlpha=sa*.7;ctx.beginPath();ctx.arc((q[0]+P[i][0])/2,(q[1]+P[i][1])/2,W(i)*.22,0,Math.PI);ctx.stroke();}
  ctx.globalCompositeOperation='lighter';ctx.strokeStyle='#9cff5a';ctx.lineWidth=1.2;ctx.globalAlpha=sa*.8;fxPoly(S.L);ctx.globalCompositeOperation='source-over';
  // head pointing down (toward the target)
  const H=P[n-1],Q=P[n-3],a=Math.atan2(H[1]-Q[1],H[0]-Q[0]);ctx.save();ctx.translate(H[0],H[1]);ctx.rotate(a);ctx.scale(1.25,1.25);
  const jaw=p.t<.53?.85+.08*Math.sin(p.t*30):p.t<.72?.05:.4;
  ctx.globalCompositeOperation='lighter';glow(8,0,26,'#9a4cff',.45*sa);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=sa;
  ctx.save();ctx.translate(2,2);ctx.rotate(jaw*.6);ctx.fillStyle='#2f8f22';ctx.strokeStyle='#0c240a';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(18,1);ctx.lineTo(15,5);ctx.lineTo(-6,6);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(12,1);ctx.lineTo(13.5,-5);ctx.lineTo(15,1);ctx.fill();ctx.restore();
  if(jaw>.3){ctx.fillStyle='#2a0418';ctx.beginPath();ctx.moveTo(2,0);ctx.lineTo(20,-2);ctx.lineTo(2+Math.cos(jaw*.6)*18,2+Math.sin(jaw*.6)*18);ctx.closePath();ctx.fill();
   ctx.strokeStyle='#ff4a9a';ctx.lineWidth=1.4;const tl=Math.sin(p.t*45)*2,tx=24+Math.sin(p.t*20)*3;ctx.beginPath();ctx.moveTo(6,3);ctx.lineTo(tx,4+tl);ctx.lineTo(tx+5,1);ctx.moveTo(tx,4+tl);ctx.lineTo(tx+5,8);ctx.stroke();}
  ctx.save();ctx.rotate(-jaw*.4);ctx.fillStyle='#2f8f22';ctx.strokeStyle='#0c240a';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-8,-6);ctx.quadraticCurveTo(8,-11,21,-3);ctx.lineTo(19,0);ctx.lineTo(4,0);ctx.quadraticCurveTo(-4,2,-8,4);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(15,-.5);ctx.lineTo(16.5,7);ctx.lineTo(18,-.5);ctx.fill();ctx.fillStyle='#0c240a';ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(11,-6);ctx.lineTo(1,-4);ctx.closePath();ctx.fill();
  ctx.globalCompositeOperation='lighter';glow(6,-5,6,'#e0a0ff',1);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=sa;ctx.fillStyle='#f0c8ff';ctx.beginPath();ctx.ellipse(6,-5,2.2,1.1,0,0,6.283);ctx.fill();ctx.restore();
  ctx.restore();}

  if(vf>0&&XWT_IMG.complete){ctx.save();const tw=185,th=tw*XWT_IMG.naturalHeight/XWT_IMG.naturalWidth,rise=(1-Math.min(1,p.t/.3))*30;ctx.translate(p.x-p.dir*125,top+30+rise+Math.sin(p.t*2)*3);ctx.scale(p.dir,1);

 if(p.st>=1&&fa>0){const k=clamp((p.t-p.ht)/.28,0,1),s=(.38+.47*(1-(1-k)*(1-k))),open=p.st===1?Math.min(1,k*1.6):clamp(1-(p.t-p.bt)/.05,0,1),sh=p.st===2&&dd<.42?p.dir*Math.sin(dd*42)*9*(1-dd/.42)+rand(-2,2):0;

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function txt(s,x,y,size,col,align,font,stroke){ctx.font=size+'px '+(font||DF);ctx.textAlign=align||'center';ctx.textBaseline='middle';if(stroke){ctx.lineJoin='round';ctx.lineWidth=stroke;ctx.strokeStyle='#0a0605';ctx.strokeText(s,x,y);}ctx.fillStyle=col;ctx.fillText(s,x,y);}

  if(max)txt('满级',b[0]+b[2]/2,b[1]+23,16,C.dim,'center',BF);else{coin(b[0]+24,b[1]+22,7);txt(String(c),b[0]+38,b[1]+23,16,ok?'#140c08':C.dim,'left',BF);}});
 drawToast(400);ghostBtn(R_BACK,'返回');}
function drawResult(){const R=G.result;ctx.fillStyle='rgba(8,5,4,.78)';ctx.fillRect(0,0,VW,VH);
 if(R.win){txt(R.cleared?'天 下 第 一':'胜',VW/2,110,R.cleared?72:120,C.gold,'center',DF,8);txt('击败 '+R.name+(R.cleared?' · 通关！下一周目对手更强':''),VW/2,186,18,C.chalk,'center',BF,4);}
 else{txt('败',VW/2,110,120,'#b8b0a8','center',DF,8);txt('败给了 '+R.name+' · 去练功房提升一下再来',VW/2,186,18,C.chalk,'center',BF,4);}
 txt('最高连击 '+R.maxCombo+'　·　铜钱 +'+R.coins,VW/2,230,18,C.gold,'center',BF,4);coinLine(VW/2,270);
 if(R.win){button(RES_BTNS.a,'下一战 · '+LADDER[SAVE.stage].name,SCHOOLS[SAVE.school].col,'#140c08',20);ghostBtn(RES_BTNS.b,'回大厅 · 练功');}
 else{if(!G.contUsed)button(RES_BTNS.a,'看广告 · 原地复活再战（演示）',C.gold,'#140c08',18);ghostBtn(RES_BTNS.b,'重新挑战');ghostBtn(RES_BTNS.c,'回大厅 · 练功');}}
function drawAd(){ctx.fillStyle='rgba(8,5,4,.9)';ctx.fillRect(0,0,VW,VH);rr(300,160,360,220,14);ctx.fillStyle=C.card;ctx.fill();
 txt('广告位（演示）',VW/2,212,28,C.gold);txt(Math.ceil(G.adT)+' 秒后返回',VW/2,262,18,C.chalk,'center',BF);txt('正式版这里接微信激励视频广告',VW/2,316,13,C.dim,'center',BF);}
function drawPortrait(){ctx.fillStyle='rgba(8,5,4,.92)';ctx.fillRect(0,0,VW,VH);txt('把手机横过来玩',VW/2,220,64,C.gold,'center',DF,6);txt('横屏才看得到完整的决斗画面 · 点任意处继续',VW/2,300,22,C.chalk,'center',BF,4);}

function render(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,cv.width,cv.height);
 ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy);ctx.save();ctx.beginPath();ctx.rect(0,0,VW,VH);ctx.clip();
 if(G.state==='menu')drawMenu();
 else if(G.state==='ladder')drawLadder();else if(G.state==='school')drawSchool();else if(G.state==='train')drawTrain();
 else{drawScene([PL,EN]);if(G.state==='fight'){drawHUD();drawControls();if(G.paused){ctx.fillStyle='rgba(8,5,4,.78)';ctx.fillRect(0,0,VW,VH);txt('暂 停',VW/2,150,56,C.chalk,'center',DF,6);button(R_PAUSE.go,'继续战斗',PL.rim,'#140c08',20);ghostBtn(R_PAUSE.home,'回大厅（本场不算）',16);ghostBtn(R_PAUSE.snd,muted?'声音：关':'声音：开',15);}}else if(G.state==='result')drawResult();else if(G.state==='ad')drawAd();}
 if(portrait&&!G.portraitOK)drawPortrait();
 ctx.restore();}

resize();
let last=performance.now();
function frame(now){const rdt=Math.min(.033,Math.max(0,(now-last)/1000));last=now;G.rt+=rdt;ambient(rdt);
 if(G.state==='fight'&&G.paused){}
 else if(G.state==='fight'){const ts=G.slow>0?.3:1;if(G.slow>0)G.slow=Math.max(0,G.slow-rdt);update(rdt*ts);}
 else if(G.state==='ad'){G.adT-=rdt;if(G.adT<=0)continueFight();}
 else if(G.state==='menu')updateMenu(rdt);else fx(rdt);
 render();requestAnimationFrame(frame);}
window.__dbg={G,SAVE,log:[],get projs(){return projs;},get PL(){return PL;},get EN(){return EN;}};
if(AUTO){setTimeout(()=>startFight(),300);setInterval(()=>{if(G.state==='result'){window.__dbg.log.push({stage:G.result.stage,win:G.result.win,t:Math.round(G.t)});startFight();}},1200);}
requestAnimationFrame(frame);
})();
</script>
