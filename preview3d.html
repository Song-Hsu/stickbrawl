<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>火柴乱斗 2.5D</title>
<style>
/* layout: one full-bleed game viewport, HUD floats on top like the real game. Single dark look (it is a game screen). */
:root { color-scheme: dark; --ink: #0d0807; --bone: #f2e6d8; --dim: rgba(242,230,216,.62); --fire: #ff8a3a; --bolt: #5fb0ff; --plate: rgba(13,8,7,.55);
  --f-display: 'ZCOOL XiaoWei', 'Noto Serif SC', serif; --f-ui: 'Noto Sans SC', system-ui, sans-serif; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--bone); font-family: var(--f-ui); overflow: hidden; }
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage canvas { display: block; width: 100%; height: 100%; }
.hud { position: fixed; left: 0; right: 0; top: 0; display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.who { display: grid; gap: 6px; min-width: 0; }
.who.r { justify-items: end; text-align: right; }
.name { font-family: var(--f-display); font-size: clamp(16px, 2.4vw, 24px); letter-spacing: .08em; text-shadow: 0 1px 6px #000; }
.name small { font-family: var(--f-ui); font-size: 11px; color: var(--dim); letter-spacing: .12em; margin-left: 6px; }
.bar { width: min(36vw, 340px); height: 9px; background: rgba(0,0,0,.5); border: 1px solid rgba(242,230,216,.25); overflow: hidden; }
.bar i { display: block; height: 100%; transform-origin: left; transition: transform .25s; }
.who.r .bar i { transform-origin: right; }
#hpA { background: linear-gradient(90deg, #c4421a, var(--fire)); }
#hpB { background: linear-gradient(270deg, #2a6fd0, var(--bolt)); }
.tag { font-family: var(--f-display); font-size: clamp(13px, 1.8vw, 18px); letter-spacing: .3em; color: var(--dim); text-shadow: 0 1px 6px #000; padding-top: 4px; }
.foot { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.note { font-size: 12px; color: var(--dim); text-shadow: 0 1px 4px #000; max-width: 60ch; }
.btns { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
button { font: 13px var(--f-ui); color: var(--bone); background: var(--plate); border: 1px solid rgba(242,230,216,.3); padding: 7px 14px; border-radius: 3px; cursor: pointer; letter-spacing: .1em; }
button[aria-pressed="true"] { border-color: var(--fire); color: var(--fire); }
button:focus-visible { outline: 2px solid var(--fire); outline-offset: 2px; }
#boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ink); font-family: var(--f-display); font-size: 28px; letter-spacing: .3em; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500&display=swap">
</head>
<body>
<div id="stage" aria-label="2.5D 战斗演示，可拖动旋转视角"></div>
<div class="hud">
  <div class="who"><div class="name">铁罗汉<small>少林 · 火</small></div><div class="bar"><i id="hpA"></i></div></div>
  <div class="tag">2.5D 预览</div>
  <div class="who r"><div class="name"><small>武当 · 雷</small>云中鹤</div><div class="bar"><i id="hpB"></i></div></div>
</div>
<div class="foot">
  <div class="note">自动演示一段过招。按住画面拖动可以转视角，能看出场景和人物都是真 3D。</div>
  <div class="btns"><span id="fps" class="note" aria-live="off"></span><button id="quality" type="button">画质</button><button id="slow" type="button" aria-pressed="false">慢放</button><button id="view" type="button">回正视角</button></div>
</div>
<div id="boot">载入中</div>
